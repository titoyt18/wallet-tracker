name: Wallet Tracker

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check ou summary"
        default: "check"

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Lancer le tracker
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WALLETS: ${{ secrets.WALLETS }}
          MIN_BUY_SOL: "0"
          MODE: ${{ github.event.schedule == '0 19 * * *' && 'summary' || (github.event.inputs.mode || 'check') }}
        run: python tracker.py
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "maj état" && git pull --rebase && git push)
